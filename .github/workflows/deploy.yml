name: 24/7 Rust AI Gateway Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

# Ensure ONLY ONE single runner runs at any time
concurrency:
  group: rust-gateway-singleton
  cancel-in-progress: true

jobs:
  run-rust-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Binary
        run: cargo build --release

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Rust Gateway & Cloudflare Tunnel
        run: |
          # 1. Start Rust binary
          ./target/release/pxy-rust &
          sleep 2

          # 2. Test local binding
          curl -s http://127.0.0.1:3000/health || echo "Health check waiting..."

          # 3. Start cloudflared tunnel
          cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > tunnel.log 2>&1 &

          URL=""
          for i in {1..40}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Failed to start tunnel. Logs:"
            cat tunnel.log
            exit 1
          fi

          echo "================================================================="
          echo ">>> YOUR LIVE 24/7 RUST AI GATEWAY URL: $URL <<<"
          echo "================================================================="
          echo "### 🚀 Live 24/7 Rust AI Gateway: \`$URL\`" >> $GITHUB_STEP_SUMMARY
          echo "#### Supported Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAI**: \`$URL/v1/chat/completions\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Anthropic**: \`$URL/v1/messages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Models**: \`$URL/v1/models\`" >> $GITHUB_STEP_SUMMARY

          # Publish commit status with target_url so we can query via API immediately
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"success\", \"target_url\": \"$URL\", \"description\": \"$URL\", \"context\": \"gateway/live-url\"}" || true

          # Keep runner active until scheduled cycle (295 minutes / ~4.9 hours)
          sleep 17700 || wait -n
