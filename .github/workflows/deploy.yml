name: 24/7 Rust AI Gateway Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: rust-gateway-singleton
  cancel-in-progress: true

jobs:
  run-rust-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Binary
        run: cargo build --release

      - name: Install Cloudflared & LocalXpose
        run: |
          # 1. Install Cloudflared
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

          # 2. Install LocalXpose
          curl -s https://api.localxpose.io/api/v2/downloads/loclx-linux-amd64.tar.gz | tar -xz
          sudo mv loclx /usr/local/bin/

      - name: Start Pure Rust Gateway & Public Tunnels
        run: |
          # Start Rust binary in background
          ./target/release/pxy-rust &
          sleep 2

          # Start Cloudflare Quick Tunnel (Free, Zero Domain Needed)
          cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > cf.log 2>&1 &

          CF_URL=""
          for i in {1..40}; do
            CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cf.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "================================================================="
          echo ">>> YOUR LIVE PURE RUST GATEWAY URL: $CF_URL <<<"
          echo "================================================================="
          echo "### 🚀 Live Pure Rust AI Gateway: \`$CF_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "#### Supported Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAI**: \`$CF_URL/v1/chat/completions\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Anthropic**: \`$URL/v1/messages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Models**: \`$CF_URL/v1/models\`" >> $GITHUB_STEP_SUMMARY

          # Publish commit status with live URL so tools and scripts can query it automatically
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"success\", \"target_url\": \"$CF_URL\", \"description\": \"$CF_URL\", \"context\": \"gateway/live-url\"}" || true

          # Keep runner active until scheduled cycle (295 minutes / ~4.9 hours)
          sleep 17700 || wait -n
