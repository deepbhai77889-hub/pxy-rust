name: Run High Performance Rust Gateway

on:
  workflow_dispatch:
  schedule:
    # Auto re-trigger every 5 hours (GitHub Actions job limit is 6 hours)
    - cron: '0 */5 * * *'

jobs:
  run-rust-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Binary
        run: cargo build --release

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Rust Gateway
        run: |
          ./target/release/pxy-rust &
          sleep 2

      - name: Start Quick Tunnel & Broadcast Live URL
        run: |
          # Start cloudflared with http2 and max throughput flags
          cloudflared tunnel --url http://localhost:3000 --no-autoupdate --http2-origin > tunnel.log 2>&1 &

          URL=""
          for i in {1..40}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Failed to start tunnel. Logs:"
            cat tunnel.log
            exit 1
          fi

          echo "================================================================="
          echo ">>> YOUR LIVE RUST AI GATEWAY URL: $URL <<<"
          echo "================================================================="
          echo "### 🚀 Live Rust AI Gateway: \`$URL\`" >> $GITHUB_STEP_SUMMARY
          echo "#### Supported Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAI**: \`$URL/v1/chat/completions\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Anthropic**: \`$URL/v1/messages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Models**: \`$URL/v1/models\`" >> $GITHUB_STEP_SUMMARY

          wait -n
