name: Run Rust High Performance Relay

on:
  workflow_dispatch:
  schedule:
    # Auto restart every 5 hours
    - cron: '0 */5 * * *'

jobs:
  run-rust-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Install Cloudflared Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Rust Proxy Server
        run: |
          ./target/release/pxy-rust &
          sleep 2

      - name: Start Tunnel and Broadcast URL
        run: |
          cloudflared tunnel --url http://localhost:3000 --no-autoupdate > tunnel.log 2>&1 &
          
          URL=""
          for i in {1..40}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Failed to start tunnel, log output:"
            cat tunnel.log
            exit 1
          fi

          echo "================================================================="
          echo ">>> RUST 1M CONTEXT PROXY URL: $URL <<<"
          echo "================================================================="
          echo "### 🚀 Rust 1M-Context Proxy URL: \`$URL\`" >> $GITHUB_STEP_SUMMARY

          wait -n
