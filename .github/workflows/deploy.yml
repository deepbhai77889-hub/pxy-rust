name: 24/7 Rust AI Gateway Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: rust-gateway-singleton
  cancel-in-progress: true

jobs:
  run-rust-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Binary
        run: cargo build --release

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Rust Gateway & Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PERMANENT_WORKER_URL: ${{ secrets.PERMANENT_WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          # 1. Start Rust binary
          ./target/release/pxy-rust &
          sleep 2

          # 2. Start Cloudflare Tunnel (Fixed Named Tunnel OR Auto-Registered Quick Tunnel)
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "Starting Fixed Named Cloudflare Tunnel..."
            cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
            URL="https://your-custom-domain.com"
          else
            cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > tunnel.log 2>&1 &

            URL=""
            for i in {1..40}; do
              URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1 || true)
              if [ -n "$URL" ]; then
                break
              fi
              sleep 1
            done
          fi

          if [ -z "$URL" ]; then
            echo "Failed to start tunnel. Logs:"
            cat tunnel.log
            exit 1
          fi

          echo "================================================================="
          echo ">>> CURRENT WORKFLOW TUNNEL URL: $URL <<<"
          echo "================================================================="
          echo "### 🚀 Current Active URL: \`$URL\`" >> $GITHUB_STEP_SUMMARY

          # 3. If Permanent Worker URL is configured, auto-update the router with zero downtime
          if [ -n "$PERMANENT_WORKER_URL" ]; then
            echo "Syncing new tunnel URL to Permanent Gateway: $PERMANENT_WORKER_URL..."
            curl -s -X POST "$PERMANENT_WORKER_URL/_update_tunnel" \
              -H "Content-Type: application/json" \
              -H "x-update-key: ${SYNC_SECRET:-pxy-rust-sync-key-77889}" \
              -d "{\"url\": \"$URL\"}" || true
            echo "### 🌐 Permanent Fixed URL: \`$PERMANENT_WORKER_URL\`" >> $GITHUB_STEP_SUMMARY
          fi

          # Publish commit status with target_url
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"success\", \"target_url\": \"$URL\", \"description\": \"$URL\", \"context\": \"gateway/live-url\"}" || true

          # Keep runner active until scheduled cycle (295 minutes / ~4.9 hours)
          sleep 17700 || wait -n
