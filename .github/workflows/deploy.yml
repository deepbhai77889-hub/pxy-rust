name: 24/7 Rust AI Gateway Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: rust-gateway-singleton
  cancel-in-progress: true

jobs:
  run-rust-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Binary
        run: cargo build --release

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Ultra-Fast Rust Gateway & Cloudflare Tunnel
        run: |
          # 1. Start Native Pure Rust binary
          ./target/release/pxy-rust &
          sleep 2

          # 2. Launch Cloudflare Quick Tunnel (HTTP/2 Max Throughput)
          cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate --http2-origin > cf.log 2>&1 &

          URL=""
          for i in {1..40}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cf.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Failed to start tunnel. Log:"
            cat cf.log
            exit 1
          fi

          echo "================================================================="
          echo ">>> YOUR ULTRA-FAST LIVE RUST AI GATEWAY URL: $URL <<<"
          echo "================================================================="
          echo "### 🚀 Live Ultra-Fast Rust AI Gateway: \`$URL\`" >> $GITHUB_STEP_SUMMARY
          echo "#### Supported Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenAI**: \`$URL/v1/chat/completions\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Anthropic**: \`$URL/v1/messages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Models**: \`$URL/v1/models\`" >> $GITHUB_STEP_SUMMARY

          # Broadcast live URL to commit status for instant fetching
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"success\", \"target_url\": \"$URL\", \"description\": \"$URL\", \"context\": \"gateway/live-url\"}" || true

          # Keep runner active until scheduled 5-hour handover (17700s / ~4.9h)
          sleep 17700 || wait -n
